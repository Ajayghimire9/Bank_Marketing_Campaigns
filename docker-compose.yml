services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      BANKPULSE_MODEL: /models/model.joblib
      BANKPULSE_MODEL_VERSION: bankpulse-2.0.0
    volumes:
      - ./artifacts:/models:ro

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlruns
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api
