name: Model Training

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev,mlops]'
      - name: Validate dataset
        run: python -m bankpulse.data_validate --data Portugal-bank_marketing/Dataset/bank-additional/bank-additional/bank-additional.csv
      - name: Train candidates
        run: bankpulse-train --data Portugal-bank_marketing/Dataset/bank-additional/bank-additional/bank-additional.csv --output artifacts
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bankpulse-model
          path: artifacts/
