name: Model Training

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev,mlops]'
      - name: Validate dataset
        run: python -m bankpulse.data_validate --data data/bank.csv
      - name: Train candidates
        run: bankpulse-train --data data/bank.csv --output artifacts
